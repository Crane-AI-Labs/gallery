# nginx config for Ease Health Uganda API + Metabase.
#
# Design:
#   - `/api/*`        → FastAPI (127.0.0.1:8000)
#   - `/metabase/*`   → Metabase (127.0.0.1:3000)
#   - everything else → 404
#
# Rate limiting is keyed on the client IP:
#   `enroll_zone`     throttles /api/enroll — that's unauthenticated, so we
#                     cap it tight (5/min) to stop token-mint floods.
#   `api_zone`        throttles everything else under /api/ — generous
#                     enough for one device to post vigorously (burst=40)
#                     but not an attacker with a stolen token.
#
# TLS: uses a purpose-generated self-signed cert pinned by the Android app.
# When a real DNS + Let's Encrypt cert is available, replace the paths below
# and the pin will need to be rotated in network_security_config.xml.

# enroll_zone tolerates a clinic-sized onboarding burst (60 devices in one
# session behind a shared NAT) but still caps sustained abuse at 5/min per IP.
# With `burst=60 nodelay`, 60 requests complete immediately, then further
# requests are throttled to the 5r/m sustained rate.
limit_req_zone $binary_remote_addr zone=enroll_zone:5m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    # Always upgrade to HTTPS. /.well-known/acme-challenge/ stays HTTP for
    # Let's Encrypt renewal when we eventually enable it.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/easehealth/easehealth.crt;
    ssl_certificate_key /etc/ssl/easehealth/easehealth.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;
    proxy_read_timeout   30s;
    proxy_connect_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # /api/enroll is the only unauthenticated endpoint — most aggressive rate limit.
    location = /api/enroll {
        limit_req zone=enroll_zone burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/enroll;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metabase is a tier_2 analytics surface — pseudonymised, but still
    # sensitive. Gate with HTTP basic auth at the proxy so a Metabase setup
    # misstep or weak admin password isn't one Google-dork from exfiltration.
    # The htpasswd file is deployed separately; creds live in .secrets.env.
    location /metabase/ {
        auth_basic           "Ease Health Analytics";
        auth_basic_user_file /etc/nginx/auth/metabase.htpasswd;

        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Metabase forwards the auth header inside the app; strip it so the
        # app doesn't see the proxy credentials.
        proxy_set_header Authorization "";
    }

    location / { return 404; }
}
